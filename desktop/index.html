<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Trefon — MATTHEW_OS</title>
  <meta name="description" content="The personal site of Matthew Trefon, built as a small operating system. Switch it on and look inside.">

  <!-- Same type families as the main site: serifs for headers, mono for the machine voice. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<!-- The OS loads straight onto the desktop. <body> carries:
       .os-desktop     — the desktop is up (set immediately on load)
       .shutting-down  — Power Off: the screen collapses, back to galaxy -->
<body>

  <!-- The visible name is ASCII art on the desktop; this is the real
       heading, kept for assistive tech and SEO. -->
  <h1 class="sr-only">Matthew Trefon</h1>

  <!-- ============== THE SCREEN ============== -->
  <!-- Full-viewport container for the desktop; collapses on Power Off. -->
  <div class="crt" id="crt" role="application" aria-label="MATTHEW_OS">
    <div class="crt__overlay" aria-hidden="true"></div>

    <!-- ============== DESKTOP ============== -->
    <div class="desktop" id="desktop" hidden>

      <!-- Classic menu bar: brand menu at left, section shortcuts, clock. -->
      <div class="menubar mono">
        <div class="menubar__brand-wrap">
          <button class="menubar__brand" id="brandBtn" type="button"
                  aria-haspopup="true" aria-expanded="false">
            <svg class="menubar__sk" viewBox="0 0 21 21" shape-rendering="crispEdges" aria-hidden="true">
              <g fill="currentColor">
                <rect x="6"  y="0"  width="2"  height="3"/>
                <rect x="14" y="0"  width="2"  height="3"/>
                <rect x="6"  y="3"  width="3"  height="1"/>
                <rect x="13" y="3"  width="3"  height="1"/>
                <rect x="7"  y="4"  width="9"  height="1"/>
                <rect x="5"  y="5"  width="12" height="1"/>
                <rect x="4"  y="6"  width="15" height="1"/>
                <rect x="3"  y="7"  width="17" height="1"/>
                <rect x="3"  y="8"  width="18" height="2"/>
                <rect x="3"  y="10" width="4"  height="2"/>
                <rect x="9"  y="10" width="8"  height="2"/>
                <rect x="19" y="10" width="2"  height="2"/>
                <rect x="3"  y="12" width="18" height="1"/>
                <rect x="4"  y="13" width="17" height="1"/>
                <rect x="5"  y="14" width="15" height="1"/>
                <rect x="4"  y="15" width="15" height="1"/>
                <rect x="7"  y="16" width="11" height="1"/>
                <rect x="7"  y="17" width="2"  height="2"/>
                <rect x="16" y="17" width="2"  height="2"/>
                <rect x="6"  y="19" width="4"  height="2"/>
                <rect x="15" y="19" width="4"  height="2"/>
              </g>
            </svg>
            Matthew Trefon
          </button>
          <div class="menubar__menu" id="brandMenu" role="menu" hidden>
            <button class="menubar__menu-item" id="powerOff" type="button" role="menuitem">
              Power Off
            </button>
          </div>
        </div>
        <nav class="menubar__nav" id="menubarNav" aria-label="Sections"></nav>
        <span class="menubar__clock" id="clock">--:--</span>
      </div>

      <!-- The desk surface: folder/document icons + the Sidekick + windows. -->
      <div class="desk" id="desk">
        <!-- Wallpaper: scattered ASCII marginalia, the same decorative
             back-layer the static site uses. Populated by JS. -->
        <div class="desk__glyphs" id="deskGlyphs" aria-hidden="true"></div>
        <div class="desk__icons" id="deskIcons"></div>

        <!-- Sidekick — pixel bunny, wanders the desktop. Markup matches the
             main site so the character stays identical across both. -->
        <svg class="sidekick" id="sidekick" viewBox="0 0 21 21" shape-rendering="crispEdges" aria-label="Sidekick" role="img">
          <!-- sk-flip carries the facing flip on its own, so turning to
               face a new direction snaps instantly instead of riding the
               travel transition (which made the bunny appear to spin). -->
          <g class="sk-flip">
          <g class="sk-body">
            <rect x="6"  y="0"  width="2"  height="3"/>
            <rect x="14" y="0"  width="2"  height="3"/>
            <rect x="6"  y="3"  width="3"  height="1"/>
            <rect x="13" y="3"  width="3"  height="1"/>
            <rect x="7"  y="4"  width="9"  height="1"/>
            <rect x="5"  y="5"  width="12" height="1"/>
            <rect x="4"  y="6"  width="15" height="1"/>
            <rect x="3"  y="7"  width="17" height="1"/>
            <rect x="3"  y="8"  width="18" height="2"/>
            <rect x="3"  y="10" width="4"  height="2"/>
            <rect x="9"  y="10" width="8"  height="2"/>
            <rect x="19" y="10" width="2"  height="2"/>
            <rect x="3"  y="12" width="18" height="1"/>
            <rect x="4"  y="13" width="17" height="1"/>
            <rect x="5"  y="14" width="15" height="1"/>
            <rect x="4"  y="15" width="15" height="1"/>
            <rect x="7"  y="16" width="11" height="1"/>
          </g>
          <!-- Feet in their own groups so the walk cycle can lift them
               in alternation. -->
          <g class="sk-foot sk-foot-l">
            <rect x="7"  y="17" width="2"  height="2"/>
            <rect x="6"  y="19" width="4"  height="2"/>
          </g>
          <g class="sk-foot sk-foot-r">
            <rect x="16" y="17" width="2"  height="2"/>
            <rect x="15" y="19" width="4"  height="2"/>
          </g>
          <g class="sk-arm">
            <g class="sk-arm-a">
              <rect x="0" y="12" width="1" height="1"/>
              <rect x="0" y="13" width="2" height="1"/>
              <rect x="1" y="14" width="1" height="1"/>
              <rect x="1" y="15" width="1" height="1"/>
              <rect x="1" y="16" width="4" height="1"/>
            </g>
            <g class="sk-arm-b">
              <rect x="0" y="14" width="1" height="1"/>
              <rect x="0" y="15" width="2" height="1"/>
              <rect x="1" y="16" width="4" height="1"/>
            </g>
          </g>
          <g class="sk-eyes">
            <rect x="7"  y="10" width="2" height="2"/>
            <rect x="17" y="10" width="2" height="2"/>
          </g>
          </g><!-- /sk-flip -->
        </svg>

        <!-- Apps dock — pinned bottom-centre. Populated by script.js. -->
        <nav class="dock" id="dock" aria-label="Apps"></nav>

        <!-- Open windows are appended here by script.js. -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
